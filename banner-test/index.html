<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>クリスマスバナー 表示テスト | sugar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fafaf8;min-height:100vh;padding:0 0 40px;font-family:sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:1.5rem 1rem}
.note{font-size:12px;color:#9a8070;line-height:1.6;margin-bottom:12px}

/* クリスマス特設ページのバナー（HPと同じ幅・3:1で表示） */
.xmas-wrap-home{position:relative}
.xmas-wrap-home::before{content:'';position:absolute;top:3px;left:3px;right:-3px;bottom:-3px;border-radius:14px;background:#5C4A3A;z-index:0}
.xmas-banner-home{position:relative;z-index:1;display:block;border-radius:14px;overflow:hidden;aspect-ratio:3/1;background:#EEE8DF}
.xmas-banner-home img{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="wrap">
  <p class="note">表示テスト用のページです（リンクなし）。<br>この画面の幅でのバナーの横幅：<span id="w"></span>px</p>
  <div class="xmas-wrap-home">
    <div class="xmas-banner-home">
      <img src="christmas2026.jpg" alt="Cafe Sugar Ebie クリスマスケーキ ご予約受付中" width="1800" height="600">
    </div>
  </div>
</div>
<script>
  // テスト用：バナーの実際の横幅を表示
  function showW(){ document.getElementById('w').textContent = Math.round(document.querySelector('.xmas-banner-home').getBoundingClientRect().width); }
  showW(); window.addEventListener('resize', showW);
</script>
</body>
</html>
